# =============================================================================
# Sub2API Docker Compose - Standalone Configuration
# =============================================================================
# This configuration runs only the Sub2API application.
# PostgreSQL and Redis must be provided externally.
#
# Usage:
#   1. Copy .env.example to .env and configure database/redis connection
#   2. docker-compose -f docker-compose.standalone.yml up -d
#   3. Access: http://localhost:8080
# =============================================================================

services:
  sub2api:
    image: weishaw/sub2api:latest
    container_name: sub2api
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    cpus: "${SUB2API_CPU_LIMIT:-4}"
    mem_limit: ${SUB2API_MEMORY_LIMIT:-4G}
    pids_limit: ${SUB2API_PIDS_LIMIT:-2000}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    volumes:
      - sub2api_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # =======================================================================
      # Auto Setup
      # =======================================================================
      - AUTO_SETUP=true

      # =======================================================================
      # Server Configuration
      # =======================================================================
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=${SERVER_MODE:-release}
      - RUN_MODE=${RUN_MODE:-standard}
      - GOMEMLIMIT=${SUB2API_GOMEMLIMIT:-3GiB}
      - GOGC=${SUB2API_GOGC:-100}

      # =======================================================================
      # Database Configuration (PostgreSQL) - Required
      # =======================================================================
      - DATABASE_HOST=${DATABASE_HOST:?DATABASE_HOST is required}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USER=${DATABASE_USER:-sub2api}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      - DATABASE_DBNAME=${DATABASE_DBNAME:-sub2api}
      - DATABASE_SSLMODE=${DATABASE_SSLMODE:-disable}
      - DATABASE_MAX_OPEN_CONNS=${DATABASE_MAX_OPEN_CONNS:-200}
      - DATABASE_MAX_IDLE_CONNS=${DATABASE_MAX_IDLE_CONNS:-30}
      - DATABASE_CONN_MAX_LIFETIME_MINUTES=${DATABASE_CONN_MAX_LIFETIME_MINUTES:-30}
      - DATABASE_CONN_MAX_IDLE_TIME_MINUTES=${DATABASE_CONN_MAX_IDLE_TIME_MINUTES:-5}

      # =======================================================================
      # Redis Configuration - Required
      # =======================================================================
      - REDIS_HOST=${REDIS_HOST:?REDIS_HOST is required}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-1024}
      - REDIS_MIN_IDLE_CONNS=${REDIS_MIN_IDLE_CONNS:-10}
      - REDIS_ENABLE_TLS=${REDIS_ENABLE_TLS:-false}

      # =======================================================================
      # Login CC Protection
      # =======================================================================
      - LOGIN_PROTECTION_ENABLED=${LOGIN_PROTECTION_ENABLED:-true}
      - LOGIN_PROTECTION_BLOOM_ENABLED=${LOGIN_PROTECTION_BLOOM_ENABLED:-true}
      - LOGIN_PROTECTION_REDIS_ENABLED=${LOGIN_PROTECTION_REDIS_ENABLED:-true}
      - LOGIN_PROTECTION_AUDIT_ENABLED=${LOGIN_PROTECTION_AUDIT_ENABLED:-true}
      - LOGIN_PROTECTION_EMAIL_RATE_PER_MINUTE=${LOGIN_PROTECTION_EMAIL_RATE_PER_MINUTE:-10}
      - LOGIN_PROTECTION_GLOBAL_RATE_PER_SECOND=${LOGIN_PROTECTION_GLOBAL_RATE_PER_SECOND:-200}
      - DEFENSE_TRUST_TIER_ENABLED=${DEFENSE_TRUST_TIER_ENABLED:-true}
      - DEFENSE_GLOBAL_RATELIMIT_ENABLED=${DEFENSE_GLOBAL_RATELIMIT_ENABLED:-true}
      - DEFENSE_APIKEY_CANDIDATE_GLOBAL_PER_2S=${DEFENSE_APIKEY_CANDIDATE_GLOBAL_PER_2S:-5000}
      - DEFENSE_FRONTEND_DOC_GLOBAL_PER_2S=${DEFENSE_FRONTEND_DOC_GLOBAL_PER_2S:-2000}
      - DEFENSE_CREDIT_ENABLED=${DEFENSE_CREDIT_ENABLED:-true}
      - DEFENSE_CREDIT_AUTO_RECOVER_PER_HOUR=${DEFENSE_CREDIT_AUTO_RECOVER_PER_HOUR:-5}
      - DEFENSE_ATTACK_DETECTOR_ENABLED=${DEFENSE_ATTACK_DETECTOR_ENABLED:-true}
      - DEFENSE_PATH_RATELIMIT_ENABLED=${DEFENSE_PATH_RATELIMIT_ENABLED:-true}
      - DEFENSE_POW_DIFFICULTY=${DEFENSE_POW_DIFFICULTY:-4}
      - DEFENSE_POW_DIFFICULTY_RECOVER=${DEFENSE_POW_DIFFICULTY_RECOVER:-5}
      - DEFENSE_VISITOR_COOKIE_ENABLED=${DEFENSE_VISITOR_COOKIE_ENABLED:-true}
      - DEFENSE_VISITOR_COOKIE_TTL_SECONDS=${DEFENSE_VISITOR_COOKIE_TTL_SECONDS:-1800}
      - DEFENSE_VISITOR_COOKIE_PER_MINUTE=${DEFENSE_VISITOR_COOKIE_PER_MINUTE:-300}
      - DEFENSE_VISITOR_COOKIE_GLOBAL_PER_2S=${DEFENSE_VISITOR_COOKIE_GLOBAL_PER_2S:-5000}
      - DEFENSE_VISITOR_COOKIE_BIND_FINGERPRINT=${DEFENSE_VISITOR_COOKIE_BIND_FINGERPRINT:-true}
      - DEFENSE_VISITOR_COOKIE_SECRET=${DEFENSE_VISITOR_COOKIE_SECRET:-}
      - DEFENSE_BLOOM_FILTER_ENABLED=${DEFENSE_BLOOM_FILTER_ENABLED:-true}
      - DEFENSE_BODY_FINGERPRINT_ENABLED=${DEFENSE_BODY_FINGERPRINT_ENABLED:-true}
      - DEFENSE_DYNAMIC_BAN_ENABLED=${DEFENSE_DYNAMIC_BAN_ENABLED:-false}
      - DEFENSE_LOGIN_AUDIT_ENABLED=${DEFENSE_LOGIN_AUDIT_ENABLED:-true}
      - SPA_PROTECT_ENABLED=${SPA_PROTECT_ENABLED:-true}
      - SPA_PROTECT_MAX_PER_MINUTE=${SPA_PROTECT_MAX_PER_MINUTE:-100}
      - SPA_PROTECT_BAN_SECONDS=${SPA_PROTECT_BAN_SECONDS:-300}

      # =======================================================================
      # Admin Account (auto-created on first run)
      # =======================================================================
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@sub2api.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}

      # =======================================================================
      # JWT Configuration
      # =======================================================================
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRE_HOUR=${JWT_EXPIRE_HOUR:-24}

      # =======================================================================
      # Timezone Configuration
      # =======================================================================
      - TZ=${TZ:-Asia/Shanghai}

      # =======================================================================
      # Gemini OAuth Configuration (optional)
      # =======================================================================
      - GEMINI_OAUTH_CLIENT_ID=${GEMINI_OAUTH_CLIENT_ID:-}
      - GEMINI_OAUTH_CLIENT_SECRET=${GEMINI_OAUTH_CLIENT_SECRET:-}
      - GEMINI_OAUTH_SCOPES=${GEMINI_OAUTH_SCOPES:-}
      - GEMINI_QUOTA_POLICY=${GEMINI_QUOTA_POLICY:-}

      # Built-in OAuth client secrets (optional)
      # SECURITY: This repo does not embed third-party client_secret.
      - GEMINI_CLI_OAUTH_CLIENT_SECRET=${GEMINI_CLI_OAUTH_CLIENT_SECRET:-}
      - ANTIGRAVITY_OAUTH_CLIENT_SECRET=${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}
      - ANTIGRAVITY_USER_AGENT_VERSION=${ANTIGRAVITY_USER_AGENT_VERSION:-}

      # =======================================================================
      # Image Generation Stream & Concurrency
      # =======================================================================
      - GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT=${GATEWAY_IMAGE_STREAM_DATA_INTERVAL_TIMEOUT:-900}
      - GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL=${GATEWAY_IMAGE_STREAM_KEEPALIVE_INTERVAL:-10}
      - GATEWAY_IMAGE_CONCURRENCY_ENABLED=${GATEWAY_IMAGE_CONCURRENCY_ENABLED:-false}
      - GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS=${GATEWAY_IMAGE_CONCURRENCY_MAX_CONCURRENT_REQUESTS:-0}
      - GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE=${GATEWAY_IMAGE_CONCURRENCY_OVERFLOW_MODE:-reject}
      - GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS=${GATEWAY_IMAGE_CONCURRENCY_WAIT_TIMEOUT_SECONDS:-30}
      - GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS=${GATEWAY_IMAGE_CONCURRENCY_MAX_WAITING_REQUESTS:-100}
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  sub2api_data:
    driver: local
