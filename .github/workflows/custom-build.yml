name: Custom Build

on:
  workflow_dispatch:
  push:
    branches:
      - custom
    tags:
      - 'custom-*'
    paths-ignore:
      - '*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: custom-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/backend-ci.yml
    permissions:
      contents: read

  security:
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read

  build-and-push:
    needs:
      - ci
      - security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: meta
        run: |
          image=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')
          sha=$(echo '${{ github.sha }}' | cut -c1-7)
          {
            echo "image=${image}"
            echo "sha=${sha}"
            echo "tags<<EOF"
            echo "${image}:custom-${sha}"
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/custom" ]]; then
              echo "${image}:custom"
            fi
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/custom-* ]]; then
              safe_ref=$(printf '%s' "$GITHUB_REF_NAME" | tr '/:@ ' '-')
              echo "${image}:${safe_ref}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GOLANG_IMAGE=golang:1.26.5-alpine
